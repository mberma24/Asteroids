# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# NOT for installation while v13 is still running. v13 is the observation arm and is on
# round 27, which this ladder does not change; switching now would confound it for nothing.
#
# The survival v3 ladder: rounds 1-27 are v13's, unchanged, and from round 28 difficulty
# comes from the pattern rather than the speed -- amplitude roughly doubles against v2, the
# period lengthens instead of shortening, and forward speed grows at half its old rate. A
# rock traces one big arc instead of vibrating across the arena.
#
# Observation v9 appends two rescaled difficulty inputs, so v13's champion widens in at zero
# weight. It is a different task hash: fork with INITIALIZE_FROM, never --resume.
[Service]
Environment=RUN=models/oracle-survival-v3-v14-expressive
Environment=CURRICULUM=configs/rl-survival-v3.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v2-v13-fireaware/champion
Environment=START_STAGE=27
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
