# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# Why now, rather than after v13 finishes round 28: the v2 ladder v13 has been climbing drops
# below its own promotion gate at round 34 and never recovers. The blind planning oracle --
# lookahead, no clairvoyance -- clears v2 round 34 at 0.688, round 40 at 0.500 and round 96 at
# 0.188, against a 0.75 gate. Everything above round 33 was unpassable by any reactive policy,
# so episodes spent there were spent climbing toward a wall.
#
# Switching costs nothing. Round 28 is the same task on both ladders: rounds 1-27 are
# inherited unchanged and round 28's ramp starts at v2's round-28 values, so the two configs
# agree to fourteen decimal places. The v3 ladder is verified clearable to the top: 0.812 at
# round 52, 0.812 at 73, 0.750 at 96.
#
# What changes from round 28 on: amplitude roughly doubles against v2, the period grows
# instead of shrinking, forward speed grows at half its old rate, and `orbit` joins the pool
# at round 29 -- a true circle around a centre that travels with the rock, where every other
# looping shape here is a bulge to one side. Straight stays one trajectory among equals.
#
# Observation v9 appends two rescaled difficulty inputs, so v13's champion widens in at zero
# weight. Different task hash: fork with INITIALIZE_FROM, never --resume.
[Service]
Environment=RUN=models/oracle-survival-v3-v14-expressive
Environment=CURRICULUM=configs/rl-survival-v3.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v2-v13-fireaware/champion
Environment=START_STAGE=28
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
