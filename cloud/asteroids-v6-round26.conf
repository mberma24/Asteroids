# Train the full survival-v2 ladder from its preserved round-26 champion with the v6
# wrap-safe absolute-position observation. Initializing (rather than resuming) widens the
# policy by four inputs while retaining every learned v5 weight and resetting optimizer
# state for the changed observation task.
[Service]
Environment=RUN=models/oracle-survival-v2-v6
Environment=CURRICULUM=configs/rl-survival-v2.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v2-postbridge-safe/champion
Environment=START_STAGE=26
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
