# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# Two ships, one shared set of weights, from scratch, on the co-operative ladder.
#
# v4 restarts because v3's first rung was a trap of my own making. Warm-up 1 held no
# asteroids at all, meant to isolate co-operation from aiming. An empty arena has exactly one
# optimal policy -- never fire -- and v3 learned it perfectly: 0.3 shots per episode, teammate
# deaths 69% -> 2%, a 100% clear, promoted at episode 7,000. On warm-up 2, where firing is
# mandatory, it could not shoot: accuracy 0.05, 61.7% of episodes destroying nothing, and the
# partner then killed by an ASTEROID in ~30% of episodes because neither ship would clear the
# field. Pooled clear sat at 14.5% against a 75% bar for 6,500 episodes without recovering.
#
# The fix is to soften the rock COUNT and never the need to shoot. The warm-up ladder is now
# 2 -> 4 -> 6 rocks before round 1's 8, so every rung trains aiming and spacing together and
# nothing learned on one rung has to be discarded on the next.
#
# Everything else carries over from v3 and stays: collision and friendly-fire deaths cost
# (they were free -- the simulator reports them as `ship_collision` and `friendly_fire`, not
# `ship_destroyed`, and only the last was handled), killing the partner costs 30.0 (derived:
# co-operating wins only while the penalty exceeds 45 * p(accident)), clearing a survival
# round requires the TEAM to survive rather than just the learner, the safety potential sees
# teammates, and teammate projectiles can no longer be crowded out of the observation.
#
# Risk worth naming: this is close to what coop2-v2 did, and v2 failed. But v2 failed under
# the broken objective where shooting the partner counted as a clear, which is fixed. The
# co-operation machinery works -- v3 drove teammate deaths to 2% -- so the open question is
# only whether it holds when aiming is required too.
#
# ent_coef stays at the 0.01 default while the run is incompetent; drop it toward 0.0025 once
# it clears a rung, per this project's measured finding that low entropy is correct here.
#
# models/coop2-scratch, models/coop2-v2 and models/coop2-v3 are kept as before-comparisons.
[Service]
Environment=RUN=models/coop2-v4
Environment=CURRICULUM=configs/rl-coop2-scratch.toml
Environment=FROM_SCRATCH=1
Environment=START_STAGE=1
Environment=LEARNING_RATE=3e-4
Environment=EVAL_EVERY=500
Environment=EPISODES=400000
