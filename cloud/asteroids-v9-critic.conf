# Install as /etc/systemd/system/asteroids.service.d/bridge.conf to run the critic arm.
#
# v7 plateaued at 0.695 clear on round 26 -- 49 evaluations since episode 60,000, slope
# +0.0005/1k at 0.8 sigma. The planning oracle clears the same round at 0.969, so the bar is
# reachable and roughly 27 points of headroom are going unclaimed.
#
# The value function is the standing suspect: explained_variance 0.479 with excursions below
# zero and value_loss 14.09, measured over v7's last 400 updates. GAE advantages built on a
# critic that sometimes does worse than predicting the mean are noisy enough to cap policy
# improvement however long the run goes.
#
# One variable against v7: vf_coef 0.5 -> 1.0. v7's banked 149-evaluation history on this
# stage is the control. Fork rather than resume -- a changed setting cannot pass the
# checkpoint's gate, so this needs a fresh RUN directory.
[Service]
Environment=RUN=models/oracle-survival-v2-v9-critic
Environment=CURRICULUM=configs/rl-survival-v2.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v2-v7/champion
Environment=START_STAGE=26
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=PPO_VF_COEF=1.0
Environment=EVAL_EVERY=500
