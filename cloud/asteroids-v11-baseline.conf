# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# Not a new hypothesis -- the best known configuration, running honestly. Three
# hyperparameter arms (entropy floor, vf_coef, gamma) returned nulls, recurrent PPO measured
# 79x too slow for this hardware, and behavioural cloning from the planning oracle produced a
# policy that clears 0.078, worse than greedy. There is no better idea to run right now, and
# the box should not sit idle.
#
# What is different from v7: promotion is pooled over 4 x 64 = 256 episodes, so a lucky
# single evaluation can no longer promote a policy that clears 0.688 on held-out seeds.
#
# Settings are v7's exactly: gamma 0.997 and vf_coef 0.5 are the defaults, restored after
# v9 and v10 tested and failed to improve on them.
[Service]
Environment=RUN=models/oracle-survival-v2-v11
Environment=CURRICULUM=configs/rl-survival-v2.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v2-v7/champion
Environment=START_STAGE=26
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
