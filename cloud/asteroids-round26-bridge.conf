# Install as /etc/systemd/system/asteroids.service.d/bridge.conf to walk the round-26 cliff.
# Round 26 doubles the large-asteroid fraction from 1/4 to 1/2 in one step, which measures
# as a ~16 point drop in clear rate and left the ladder stalled for 67,000 episodes.
[Service]
Environment=RUN=models/oracle-round26-bridge
Environment=CURRICULUM=configs/rl-survival-v2-round26-bridge.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v2-postbridge-safe/champion
Environment=START_STAGE=1
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
