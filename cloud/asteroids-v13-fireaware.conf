# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# The observation arm, against a clean control. `v12-detfrag` made the task solvable --
# with deterministic fragments the blind planning oracle clears round 26 at 1.000 where it
# cleared 0.812 before -- and the policy did not exploit it: one promotion at episode 3,000,
# then round 27 flat at 0.67 across 45 evaluations and 22,000 episodes, champion unchanged
# since episode 3,500. Removing the hidden draw was necessary and is not sufficient.
#
# v13 forks v12's champion onto the same ladder at the same rung, changing only what the
# policy sees: observation v8 appends ten inputs describing the shot it is about to take.
# Measured on that exact champion over 96 episodes, 93% of the shots whose fragment went on
# to kill it were predicted to hit the ship, against 3.7% of all splitting shots.
#
# The block is appended last and starts at zero weight, so v13 begins as a copy of v12's
# champion. v12's round-27 curve is the control: anything above ~0.67 that holds is the
# observation earning its place.
[Service]
Environment=RUN=models/oracle-survival-v2-v13-fireaware
Environment=CURRICULUM=configs/rl-survival-v2-fireaware.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v2-v12-detfrag/champion
Environment=START_STAGE=27
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
