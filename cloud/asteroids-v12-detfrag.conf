# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# Deterministic fragments. Measured 2026-09-02: the blind planning oracle (lookahead, no
# clairvoyance) clears round 26 at 0.812, so the reactive ceiling is ~0.81 rather than the
# 0.969 the clairvoyant oracle reported, and the policy at ~0.70 is close to it. Of the v7
# champion's 23 deaths over 96 seeds, 19 were fragments of a rock it had itself just shot,
# whose speed, pattern and phase were drawn from the RNG at the moment of the shot.
#
# rl-survival-v2-detfrag.toml is survival-v2 with `fragment_motion = "inherit"`: a
# fragment keeps its parent's motion, rescaled by size. No hidden draw, so no death the
# observation could not in principle have predicted. Forked from the v7 champion at round 26
# with v11's settings; it is a different task hash, so INITIALIZE_FROM rather than resume.
[Service]
Environment=RUN=models/oracle-survival-v2-v12-detfrag
Environment=CURRICULUM=configs/rl-survival-v2-detfrag.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v2-v7/champion
Environment=START_STAGE=26
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
