# Install as /etc/systemd/system/asteroids.service.d/bridge.conf to run the discount arm.
#
# The critic has been the suspect since 2026-08-24 (explained_variance 0.479, dipping below
# zero). v9 tested it by doubling vf_coef to 1.0 and failed on its own terms: explained
# variance went DOWN to 0.386 over 9,000 episodes, and the policy ran 1.9 sigma below the
# champion it forked from. The coefficient was never the constraint.
#
# The horizon is the better suspect. gamma 0.997 is an effective horizon of 333 decisions --
# 22.2 seconds of a 30-second round -- so the critic is asked to predict roughly "how much
# longer will I survive", which is high variance and largely unknowable. gamma 0.99 is 100
# decisions, 6.7 seconds.
#
# The planning oracle is why 6.7s is enough: it clears this round at 0.969 using only 2.0s
# of lookahead (metrics/planning-oracle.json). Perfect play does not need a 22-second value
# estimate, so the long discount is buying variance rather than foresight.
#
# Falsification: if explained_variance does not rise well above 0.479, the critic is not
# fixable by this route either and the next lead is observation work, which is the only
# intervention that has ever moved this number on its own (v7 features, +0.040 over v5).
#
# One variable against v7: gamma 0.997 -> 0.99. vf_coef returns to its 0.5 default.
# Promotion is now pooled over 4 x 64 = 256 episodes, so a lucky single draw cannot promote.
[Service]
Environment=RUN=models/oracle-survival-v2-v10-gamma
Environment=CURRICULUM=configs/rl-survival-v2.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v2-v7/champion
Environment=START_STAGE=26
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=PPO_GAMMA=0.99
Environment=EVAL_EVERY=500
