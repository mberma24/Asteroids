# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# Two ships, ONE shared set of weights, trained FROM SCRATCH on the co-operative ladder.
#
# Why not fork the solo champion: that run (models/coop2-v1) went backwards -- pooled clear
# 50.0 -> 43.8 over 3,000 episodes with accuracy stuck at 0.15 against 0.72 solo. A policy
# carrying solo habits fires constantly and cannot see its twin (the teammate inputs start at
# zero weight), so it is punished for collisions and friendly fire with no visible cause.
# It stays as the transfer baseline to compare against.
#
# `FROM_SCRATCH=1` is required: SOURCE falls back to models/source/champion, which exists on
# this box, so leaving INITIALIZE_FROM unset would silently fork rather than start clean.
#
# 3e-4, not the 5e-5 used for fine-tuning a champion -- this policy has everything to learn.
# target_kl 0.02 is what makes that rate safe here. ent_coef is left at its 0.01 default for
# early exploration; the 0.0025 finding applies to a trained policy at round 26, not to one
# starting from nothing.
[Service]
Environment=RUN=models/coop2-scratch
Environment=CURRICULUM=configs/rl-coop2-scratch.toml
Environment=FROM_SCRATCH=1
Environment=START_STAGE=1
Environment=LEARNING_RATE=3e-4
Environment=EVAL_EVERY=500
Environment=EPISODES=400000
