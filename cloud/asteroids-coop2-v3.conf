# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# Two ships, one shared set of weights, from scratch, on the fixed co-operative ladder.
#
# What was wrong with models/coop2-scratch (100,000 episodes stuck at 42% clear on the
# easiest round, accuracy 0.10 against 0.72 solo): the policy shot its own teammate in 84% of
# episodes -- measured on an arena containing no asteroids at all -- and paid nothing for it.
# The simulator reports a teammate kill as `friendly_fire` and a collision as `ship_collision`,
# neither of which is `ship_destroyed`, and only that last one was ever penalised. The shooter
# then inherited an empty arena, so eliminating the partner was the reward-maximising move.
#
# Fixed: both deaths now cost, killing the partner costs 30.0 (derived: co-operating wins only
# while the penalty exceeds 45 * p(accident), and this run's accident rate was 56%), the
# metrics are recorded so the failure mode is visible, teammate projectiles can no longer be
# crowded out of the observation by the agent's own, and three warm-up rounds isolate
# co-operation before any asteroid appears.
#
# v3 restarts because v2's ladder position was earned dishonestly. Clearing a survival round
# was scored on the LEARNER surviving, so shooting the partner and cruising to the limit
# counted as a clear: coop2-v2 cleared warm-up 1 in 30 of 30 episodes while killing its
# partner in all 30, and that 0.92 promoted it. Under team-survival clearing the same policy
# scores 0 of 30. Every number v2 produced after episode 6,500 measured the wrong thing.
#
# Also new since v2: the safety potential now sees teammates (nothing rewarded the separation
# that avoids a point-blank shot), teammate separation is recorded, and miss_penalty is 0.08
# because firing 11 times into an empty arena cost 0.22 a round.
#
# models/coop2-scratch and models/coop2-v2 are kept as before-comparisons.
[Service]
Environment=RUN=models/coop2-v3
Environment=CURRICULUM=configs/rl-coop2-scratch.toml
Environment=FROM_SCRATCH=1
Environment=START_STAGE=1
Environment=LEARNING_RATE=3e-4
Environment=EVAL_EVERY=500
Environment=EPISODES=400000
