# Ordinary PPO with action-specific fragment warnings. No gameplay/curriculum changes.
[Service]
WorkingDirectory=/home/ubuntu/Asteroids
ExecStart=
ExecStart=/home/ubuntu/Asteroids/cloud/train-forever.sh
StandardOutput=append:/home/ubuntu/Asteroids/cloud-train.log
StandardError=append:/home/ubuntu/Asteroids/cloud-train.log
Environment=PYTHONPATH=/home/ubuntu/Asteroids/src
Environment=RUN=models/oracle-survival-v3-v21-action-fire
Environment=CURRICULUM=configs/rl-survival-v3-action-fire.toml
Environment=INITIALIZE_FROM=/home/ubuntu/Asteroids/experiments/fragment-warning-v21/widened-source
Environment=START_STAGE=29
Environment=SEED=2108
Environment=LEARNING_RATE=1.6666666666666667e-5
Environment=PPO_ENT_COEF=0.0025
Environment=PPO_TARGET_KL=0.02
Environment=EVAL_EVERY=500
