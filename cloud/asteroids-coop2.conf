# Install as /etc/systemd/system/asteroids.service.d/bridge.conf to train the two-ship tier.
#
# Both ships run ONE set of weights: `ships = 2` spawns two PPO ships and the trainer flies
# them with the same policy. `ships > 1` also forces `friendly_collisions = "full"`, so
# bumping into a teammate kills both ships and a shot that lands on a teammate kills it --
# pinned by test_coop_tier_kills_ships_that_collide_or_shoot_each_other.
#
# Starts at coop round 1 (stage index 96, one-based 97), whose asteroid field is identical to
# solo round 1 -- a field this policy clears at 0.92+. When a new axis is introduced every
# other axis resets to a level already mastered, so co-operation is the only new problem.
#
# The solo champion seeds it: the coop observation is 8 inputs wider (teammate slots, which
# are appended last), and `widen_policy` copies every existing weight and zeroes the new
# columns, so the run starts with all of its solo skill intact.
[Service]
Environment=RUN=models/coop2-v1
Environment=CURRICULUM=configs/rl-survival-v2-coop.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v2-v7/champion
Environment=START_STAGE=97
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
