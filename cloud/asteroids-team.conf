# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
# Gradual round-29 composition curriculum. The source champion stalls when round 28 jumps
# directly from 50% to 100% large asteroids; v8 inserts eight 1/16 composition steps while
# holding round-28 physics fixed, then resumes the production ladder.
[Service]
ExecStart=
ExecStart=/home/ubuntu/Asteroids/cloud/train-team-forever.sh
Environment=RUN=models/team-large-bridge-v2
Environment=INITIAL_CHECKPOINT=models/team-large-bridge-v1/champion
Environment=STEPS=10000000
Environment=PARALLEL_ENVS=4
Environment=EVAL_EVERY=65536
Environment=EVAL_EPISODES=128
Environment=KEEP_CHECKPOINTS=3
Environment=SEED=0
Environment=PPO_DEVICE=cpu
