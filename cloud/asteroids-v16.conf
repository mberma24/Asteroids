# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# Moving `orbit` to a later round would have produced the identical cliff at a different round
# number, so this fixes the cause instead.
#
# Orbit costs 15-19 points of clear rate at round 29 at every rate and reach tried, across
# 57-249 px/s of tangential speed, so its difficulty is not a tuning knob. Measured on round
# 29, a half-second straight-line prediction is off by a median 58px for an orbiting rock
# against 0-7px for every other pattern -- larger than a big asteroid plus the ship -- because
# the threat features extrapolate in a straight line while a circling rock's heading rotates
# continuously. An arc extrapolation cuts that to 18px.
#
# Observation v10 appends that arc-aware threat block, alongside the straight-line one rather
# than replacing it, since an arc guess is worse on the corner patterns. The champion widens
# in at zero weight.
#
# Same playbook as the fire-consequence block, which is the only intervention on this line
# that has ever cleared a rung: when the policy could not compute something, give it the
# computation.
#
# Falsifiable: if round 29 is not above 0.65 within 20,000 episodes, the arc block is not the
# answer either, and orbit comes out of the pool rather than being retuned a third time.
[Service]
Environment=RUN=models/oracle-survival-v3-v16-arc
Environment=CURRICULUM=configs/rl-survival-v3.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v3-v15/champion
Environment=START_STAGE=29
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
