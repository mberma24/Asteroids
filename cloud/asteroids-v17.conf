# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# v16 ran 203,500 episodes on round 29 and moved 0.497 -> 0.533. At that rate the 0.75 gate is
# roughly 540,000 episodes away, so it is not a slow success, it is a stall.
#
# Removing orbit was the obvious answer and it is the wrong one: it teaches the policy it will
# never meet a circling rock, and the next rung then has to unlearn that. This is the rule the
# co-op ladder already paid for -- soften how much of a challenge there is, never whether the
# skill is needed at all.
#
# Measured on the v16 champion, 48 held-out seeds, round 29:
#
#   orbit share   8.3%   4.3%   2.2%   1.1%   none
#   clear        0.542  0.604  0.625  0.583  0.625
#
# At 2% the round scores what it scores with no orbit at all, while still putting 1.5 orbiting
# rocks per episode in front of the policy. Saturation is what makes the round unpassable, not
# exposure. So orbit is ramped: 2% from round 29, 4% from 40, full share from 49.
#
# Falsifiable, and this time it does not shuffle the problem elsewhere: if round 29 is not
# above 0.65 within 20,000 episodes, the ladder is not the constraint and the next move is
# architectural, not another curriculum edit.
[Service]
Environment=RUN=models/oracle-survival-v3-v17-ramp
Environment=CURRICULUM=configs/rl-survival-v3.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v3-v16-arc/champion
Environment=START_STAGE=29
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
