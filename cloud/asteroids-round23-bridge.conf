# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
# This keeps the one-off round-23 repair durable without changing the generic service file.
[Service]
Environment=RUN=models/oracle-round23-bridge
Environment=CURRICULUM=configs/rl-survival-v2-round23-bridge.toml
Environment=INITIALIZE_FROM=models/oracle-lowent/champion
Environment=START_STAGE=1
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
