# Install as /etc/systemd/system/asteroids.service.d/bridge.conf to run with an entropy floor.
#
# Policy entropy fell monotonically in every previous run and the per-round learning slope
# decayed with it: 0.711 nats while round 23 still improved at +0.0134 per 1k episodes, 0.588
# by the time round 26 sat at +0.0000 over 112,500 episodes. Both fixed coefficients failed --
# 0.01 pinned entropy at 1.07 and stalled, 0.0025 collapses it -- so the bonus adapts instead.
#
# Fork rather than resume: a run whose reward or observation version has moved cannot pass
# the checkpoint's reward gate, so this needs a fresh RUN directory.
[Service]
Environment=RUN=models/oracle-survival-v2-v8
Environment=CURRICULUM=configs/rl-survival-v2.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v2-v7/champion
Environment=START_STAGE=26
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=PPO_ENTROPY_FLOOR=0.8
Environment=EVAL_EVERY=500
