# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# v14 stalled on round 29 at 0.44 for 104 evaluations and 52,000 episodes. Ablated on its own
# champion over 64 held-out seeds, two changes land on that round and compound:
#
#   round 28                      0.734
#   round 29, neither change      0.688
#   round 29, all-large mix only  0.609
#   round 29, orbit only          0.609
#   round 29 as shipped           0.453
#
# The round is fair -- the blind oracle clears it 0.812 against the 0.75 gate -- so this is a
# step too big rather than an impossible rung.
#
# Fixed here: rounds 29-30 go three-quarters large before all-large at 31, which took the
# no-orbit round from 0.609 to 0.719. Orbit stays at 2 turns per period; slowing it was tested
# across the grid and lost.
#
# Still open, and stated so it is not discovered later: orbit costs 15-19 points at every
# setting tried, so round 29 starts near 0.58 against a 0.75 gate. This line has never climbed
# more than about 7 points on a rung. If round 29 is still under 0.65 in 20,000 episodes,
# orbit needs to come out of the pool or arrive much later, not be retuned again.
[Service]
Environment=RUN=models/oracle-survival-v3-v15
Environment=CURRICULUM=configs/rl-survival-v3.toml
Environment=INITIALIZE_FROM=models/oracle-survival-v3-v14-expressive/champion
Environment=START_STAGE=29
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
