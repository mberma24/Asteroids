# Install as /etc/systemd/system/asteroids.service.d/bridge.conf once the round-26 bridge
# has been trained, replacing asteroids-round26-bridge.conf. The bridge champion returns to
# the full survival-v2 ladder at round 26 and can promote normally from there.
#
# 5e-5 is not optional. The identical fork at 1e-4 stalled at 0.63 clear on round 23 while
# this rate promoted through rounds 23, 24 and 25; it is the only difference between those
# two runs.
[Service]
Environment=RUN=models/oracle-survival-v2-round26-post
Environment=CURRICULUM=configs/rl-survival-v2.toml
Environment=INITIALIZE_FROM=models/oracle-round26-bridge/champion
Environment=START_STAGE=26
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
