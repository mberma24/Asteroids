# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# Two ships, one shared set of weights, from scratch, on the co-operative ladder.
#
# v5 restarts because v4 was training one seat and flying two. Diagnosis, measured by putting
# a single checkpoint in both ships and counting who shot whom:
#
#   friendly_fire_taken  60.3% of episodes    (the companion killed the learner)
#   friendly_fire_dealt   6.4% of episodes    (the learner killed the companion)
#   death_penalty         3.4% of episodes    (an asteroid killed the learner)
#
# Sixty percent of episodes ended with the learner shot by its own partner, and the partner
# was a copy of the learner. The gap follows the SEAT, not which ship is learning: ship2 shot
# ship1 in 35-37% of episodes either way. Ships spawn at fixed mirrored poses (ship1 y=370
# facing up, ship2 y=530 facing down) and the network is not equivariant to that mirroring,
# so 28,000 episodes of gradient shaped ship1's pose and left ship2's unshaped. Nearly
# nothing the co-operative reward was shaping was the thing actually killing the learner.
#
# Fixed in c5520c6: the learner's seat is redrawn from the episode seed, and companions are
# encoded on the correct side of the history record -- their actions used to be encoded one
# line after this decision's asteroid positions had been folded into the shared history, so
# every companion read its own present as its most recent past and flew as if the world were
# frozen.
#
# The warm-up ladder from v4 stands: 2 -> 4 -> 6 rocks before round 1's 8, because v3's
# asteroid-free first rung taught the policy never to fire. Everything from v3 stands too:
# team-survival clearing, collision and friendly-fire penalties,
# friendly_fire_dealt_penalty = 30.0, the teammate-aware safety potential, and teammate
# projectiles that cannot be crowded out of the observation.
#
# ent_coef stays at the 0.01 default while the run is incompetent; drop toward 0.0025 once it
# clears a rung.
#
# models/coop2-scratch, coop2-v2, coop2-v3 and coop2-v4 are kept as before-comparisons.
[Service]
Environment=RUN=models/coop2-v5
Environment=CURRICULUM=configs/rl-coop2-scratch.toml
Environment=FROM_SCRATCH=1
Environment=START_STAGE=1
Environment=LEARNING_RATE=3e-4
Environment=EVAL_EVERY=500
Environment=EPISODES=400000
