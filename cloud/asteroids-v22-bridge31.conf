# Install as /etc/systemd/system/asteroids.service.d/bridge.conf, but ONLY after v21 has
# promoted to round 31. See docs/round31-bridge.md for the checks to run first.
#
# v21's settings exactly; the only change is the ladder, which bridges the all-large
# composition step over rounds 31-32 instead of taking it in one round. That step is a
# measured -0.102 clear [-0.188, -0.012] across four champions, and v21's champion plays
# round 31 at 0.516 against a 0.75 gate.
#
# INITIALIZE_FROM, never RESUME: the bridged ladder has a different task_hash and a resume
# would be rejected. Point it at a *copy* of the champion, so the live v21 run is untouched
# and remains a rollback target.
[Service]
Environment=RUN=models/oracle-survival-v3-v22-bridge31
Environment=CURRICULUM=configs/rl-survival-v3-bridge31-action-fire.toml
Environment=INITIALIZE_FROM=/home/ubuntu/Asteroids/experiments/bridge31/source
Environment=START_STAGE=31
Environment=SEED=2231
Environment=LEARNING_RATE=1.6666666666666667e-5
Environment=PPO_ENT_COEF=0.0025
Environment=PPO_TARGET_KL=0.02
Environment=EVAL_EVERY=500
