# Ordinary PPO from a measured incumbent, with smaller updates.
# v19's first/last 20 evaluation clear rates were .652/.622 after 66k episodes,
# and its protected champion was still episode 500. This tests policy drift as a
# cause; it does not establish that learning rate is the reason for the plateau.
# The starting champion is installed from a 256-seed baseline before training.
# No orbit, reward, observation, promotion, or architecture changes.
[Service]
Environment=RUN=models/oracle-survival-v3-v20-conservative
Environment=CURRICULUM=configs/rl-survival-v3.toml
Environment=INITIALIZE_FROM=/home/ubuntu/asteroids-experiments/night-2026-09-08/selected-source
Environment=START_STAGE=29
Environment=LEARNING_RATE=1.6666666666666667e-5
Environment=PPO_ENT_COEF=0.0025
Environment=PPO_TARGET_KL=0.02
Environment=EVAL_EVERY=500
