# Install as /etc/systemd/system/asteroids.service.d/bridge.conf after the temporary
# round-23 bridge is mastered. The bridge champion is transferred back into the full
# survival-v2 ladder at original round 23; it can then promote normally through rounds 24-96.
[Service]
Environment=RUN=models/oracle-survival-v2-postbridge-safe
Environment=CURRICULUM=configs/rl-survival-v2.toml
Environment=INITIALIZE_FROM=models/oracle-round23-bridge/champion
Environment=START_STAGE=23
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
