# Install as /etc/systemd/system/asteroids.service.d/bridge.conf.
#
# Ordinary training resumed from the best policy the overnight orbit-practice experiment
# produced. That experiment compared focused orbit drills against the ordinary training mix
# from the same source and reported inconclusive: on its own final panels the control arm
# scored 0.660 on round 29 against the practice arm's 0.652, and beat it on the pre-ramp
# benchmark (0.531 against 0.477) and on retention over rounds 23-28 (0.877 against 0.840).
# Drilling a pattern in isolation bought nothing over meeting it in the mix.
#
# What it did produce is a much better policy. Scored here on the live curriculum over the
# same 64 held-out seeds at round 29:
#
#   control candidate (5465)   0.703
#   control latest (13662)     0.688
#   v17 champion               0.500
#
# So the orbit ramp plus roughly 13,000 further episodes moved round 29 from 0.50 to 0.70
# against a 0.75 gate. This run continues from that candidate with the standard settings: no
# drills, no experiment machinery, ordinary promotion.
[Service]
Environment=RUN=models/oracle-survival-v3-v19
Environment=CURRICULUM=configs/rl-survival-v3.toml
Environment=INITIALIZE_FROM=models/v18-control-candidate
Environment=START_STAGE=29
Environment=LEARNING_RATE=5e-5
Environment=PPO_ENT_COEF=0.0025
Environment=EVAL_EVERY=500
