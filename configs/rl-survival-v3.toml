# Rounds 83-96.
[[progression.phases]]
until = 69
patterns = ["sine", "arc", "s_curve", "zigzag", "sawtooth", "lane_change", "corkscrew", "figure_eight", "spiral", "serpentine", "brownian", "orbit"]
linear_probability = 0.0769231
asteroid_size = "mixed"
