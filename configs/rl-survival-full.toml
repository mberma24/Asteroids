# Survival ladder, tier five: all eleven trajectory patterns, a quarter of them straight.
#
# Straight-line motion is not a special case here, it is the twelfth trajectory: every
# pattern, a straight line included, is equally likely. A field of nothing but curves would
# be its own narrow distribution -- a policy can learn to always expect a turn -- and
# singling straight out with its own probability was the same mistake in reverse.
#
# This is the long tier. Every knob tightens round on round: speed, amplitude, oscillation
# period, spawn rate, starting count, and the spread that aims rocks nearer the centre.
[curriculum]
extends = "rl-survival-curves.toml"

[progression]
rounds = 30
name_prefix = "full-round"
survival = true
asteroid_size = "large"
patterns = [
  "sine", "zigzag", "sawtooth", "arc", "s_curve", "lane_change",
  "serpentine", "corkscrew", "figure_eight", "spiral", "brownian",
]
# Eleven curves plus a straight line is twelve equally likely options.
linear_probability = 0.0833
movement_enabled = true
ship_invulnerable = false

min_speed_start = 46.0
min_speed_step = 1.862
max_speed_start = 70.0
max_speed_step = 3.034
amplitude_min_start = 12.0
amplitude_min_step = 0.0
amplitude_max_start = 34.0
amplitude_max_step = 3.310
wavelength_min_start = 3.4
wavelength_min_step = -0.0552
wavelength_max_start = 5.2
wavelength_max_step = -0.0793
spawn_interval_start = 1.3
spawn_interval_step = -0.01379
spawn_spread_start = 152.0
spawn_spread_step = -3.690
initial_asteroids_start = 10.0
initial_asteroids_step = 0.20690
spawn_safe_radius = 60.0
spawn_safe_seconds = 1.8

max_seconds_start = 30.0
max_seconds_step = 0.0
no_hit_seconds_start = 0.0
no_hit_seconds_step = 0.0
promotion_accuracy = 0.05
miss_penalty = 0.02
