# Same tasks, rewards, orbit schedule and promotion rules; only add action warnings.
#
# `promotion_completion` is the one exception, and it is a correction rather than a relaxation.
# Promotion reads two gates as one condition, so the harder of them is the real gate. Measured
# over 1,206 pooled 256-episode evaluations on rounds 29-30, a policy sitting exactly at the
# clear gate of 0.75 reaches completion 0.869 [0.8675, 0.8703] -- so a 0.90 completion bar
# rejects a policy that has met the bar everyone reads as the gate. Ten pools cleared 0.75; one
# of them also cleared 0.90.
#
# 0.86 is where completion stops binding: at 0.86 and at 0.85 exactly the same 11 pools
# qualify, so below that only the clear gate moves, which is the intent. The change is modest
# rather than a floodgate -- 0.9% of pools qualify against 0.08% today.
#
# This does not change the task, only when the ladder advances, so it is not part of
# `task_hash` and a running checkpoint resumes straight through it. See
# `test_promotion_gates_are_not_part_of_the_task_identity`.
[curriculum]
extends = "rl-survival-v3.toml"
observation_version = 11
promotion_completion = 0.86
