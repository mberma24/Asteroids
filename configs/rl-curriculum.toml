[curriculum]
base_config = "configs/rl-arcade.toml"
# 32 episodes give a standard error near 8 points at the completion rates that matter, so
# readings swing +-17 points on noise and the promotion gate ends up waiting on a lucky
# draw. 96 halves that, at the cost of 64 extra episodes per evaluation.
evaluation_episodes = 96
retention_evaluation_episodes = 8
# Score ten prior stages per evaluation, rotating. Re-scoring all of them was
# two thirds of every evaluation and half of the run's total decisions.
retention_sample = 10
promotion_completion = 0.80
retention_completion = 0.75
# Accuracy is only an anti-spam floor. Completion and clear speed decide mastery.
promotion_accuracy = 0.05
promotion_streak = 2
promotion_window = 4
current_stage_probability = 0.75

[reward]
# Every hit pays the same so partial progress is immediately worth something; with graded
# values a first large-rock hit paid 0.2 while an exploratory miss cost 0.28, which made
# playing at the agent's own accuracy worse than idling out the clock.
large = 1.0
medium = 1.0
small = 1.0
wave_clear = 5.0
# Speed dominates the terminal bonus; accuracy remains a smaller secondary bonus.
fast_clear = 6.0
accuracy = 2.0
# Dense but deliberately tiny feedback for a wasted shot. At +1 per hit this makes
# shooting break even around 2.9% accuracy, while the 5% gate still rejects blind spam.
miss_penalty = 0.03
timeout_penalty = 8.0
death_penalty = 5.0
active_time_penalty = 0.02
par_time_per_wave = 45.0
aim_progress = 0.15

# Stationary size ladder. Small costs one total hit, medium costs three after splitting,
# and large costs seven. Total required hits rise smoothly before any new mechanic appears.
# Dry-spell windows are set from measurement, not by hand: the longest gap between
# kills the greedy baseline actually needs on each stage, over sixteen seeds, with
# 60% headroom and a 20s floor. Several were far too tight even before fragments
# were sped up -- stage 13 needed 33s and allowed 17 -- so competent play was being
# cut off as though it had stalled.
[[stages]]
name = "stationary-1-small"
composition = ["small"]
min_speed = 0.0
max_speed = 0.0
linear_probability = 1.0
max_seconds = 30.0
no_hit_seconds = 20.0
promotion_accuracy = 0.05
miss_penalty = 0.03

